<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>SiteWatch 360 logo</title>
  <desc>A bold monoline mark of a signal tower inside a broken circular ring, representing 360-degree monitoring.</desc>

  <!-- Outer ring, broken at four points to suggest a radar/360 sweep -->
  <circle cx="200" cy="200" r="148" fill="none" stroke="#1E2A4A" stroke-width="16"
          stroke-dasharray="170 30" stroke-linecap="round" transform="rotate(-45 200 200)"/>

  <!-- Tower mast -->
  <line x1="200" y1="325" x2="200" y2="150" stroke="#1E2A4A" stroke-width="16" stroke-linecap="round"/>

  <!-- Tower cross-bars, narrowing toward the top -->
  <line x1="160" y1="298" x2="240" y2="298" stroke="#1E2A4A" stroke-width="16" stroke-linecap="round"/>
  <line x1="172" y1="253" x2="228" y2="253" stroke="#1E2A4A" stroke-width="16" stroke-linecap="round"/>
  <line x1="184" y1="208" x2="216" y2="208" stroke="#1E2A4A" stroke-width="16" stroke-linecap="round"/>

  <!-- Diagonal leg supports -->
  <line x1="160" y1="298" x2="200" y2="150" stroke="#1E2A4A" stroke-width="10" stroke-linecap="round"/>
  <line x1="240" y1="298" x2="200" y2="150" stroke="#1E2A4A" stroke-width="10" stroke-linecap="round"/>

  <!-- Signal waves emitting from tower top -->
  <path d="M 172 122 A 36 36 0 0 1 228 122" fill="none" stroke="#E8873A" stroke-width="14" stroke-linecap="round"/>
  <path d="M 152 96 A 62 62 0 0 1 248 96" fill="none" stroke="#E8873A" stroke-width="14" stroke-linecap="round"/>

  <!-- Transmitter tip -->
  <circle cx="200" cy="150" r="16" fill="#E8873A"/>
</svg>
