<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>SiteWatch 360 logo</title>
  <desc>A minimalist monoline mark of a signal tower inside a broken circular ring, representing 360-degree monitoring.</desc>

  <!-- Outer ring, broken at four points to suggest a radar/360 sweep -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#1E2A4A" stroke-width="6"
          stroke-dasharray="180 20" stroke-linecap="round" transform="rotate(-45 200 200)"/>

  <!-- Tower mast -->
  <line x1="200" y1="330" x2="200" y2="150" stroke="#1E2A4A" stroke-width="7" stroke-linecap="round"/>

  <!-- Tower cross-bars, narrowing toward the top -->
  <line x1="165" y1="300" x2="235" y2="300" stroke="#1E2A4A" stroke-width="7" stroke-linecap="round"/>
  <line x1="175" y1="255" x2="225" y2="255" stroke="#1E2A4A" stroke-width="7" stroke-linecap="round"/>
  <line x1="185" y1="210" x2="215" y2="210" stroke="#1E2A4A" stroke-width="7" stroke-linecap="round"/>

  <!-- Diagonal leg supports -->
  <line x1="165" y1="300" x2="200" y2="150" stroke="#1E2A4A" stroke-width="4" stroke-linecap="round"/>
  <line x1="235" y1="300" x2="200" y2="150" stroke="#1E2A4A" stroke-width="4" stroke-linecap="round"/>

  <!-- Signal waves emitting from tower top -->
  <path d="M 178 128 A 32 32 0 0 1 222 128" fill="none" stroke="#E8873A" stroke-width="6" stroke-linecap="round"/>
  <path d="M 165 108 A 55 55 0 0 1 235 108" fill="none" stroke="#E8873A" stroke-width="6" stroke-linecap="round"/>

  <!-- Transmitter tip -->
  <circle cx="200" cy="150" r="8" fill="#E8873A"/>
</svg>
