<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>SiteWatch 360 logo</title>
  <desc>A bold monoline mark of a signal tower inside a broken circular ring, representing 360-degree monitoring.</desc>

  <!-- Outer ring, broken at four points to suggest a radar/360 sweep -->
  <circle cx="200" cy="200" r="135" fill="none" stroke="#1E2A4A" stroke-width="36"
          stroke-dasharray="160 40" stroke-linecap="round" transform="rotate(-45 200 200)"/>

  <!-- Tower mast -->
  <line x1="200" y1="310" x2="200" y2="160" stroke="#1E2A4A" stroke-width="38" stroke-linecap="round"/>

  <!-- Tower cross-bars, narrowing toward the top -->
  <line x1="150" y1="285" x2="250" y2="285" stroke="#1E2A4A" stroke-width="38" stroke-linecap="round"/>
  <line x1="165" y1="235" x2="235" y2="235" stroke="#1E2A4A" stroke-width="38" stroke-linecap="round"/>
  <line x1="180" y1="185" x2="220" y2="185" stroke="#1E2A4A" stroke-width="38" stroke-linecap="round"/>

  <!-- Diagonal leg supports -->
  <line x1="150" y1="285" x2="200" y2="160" stroke="#1E2A4A" stroke-width="22" stroke-linecap="round"/>
  <line x1="250" y1="285" x2="200" y2="160" stroke="#1E2A4A" stroke-width="22" stroke-linecap="round"/>

  <!-- Signal waves emitting from tower top -->
  <path d="M 160 115 A 45 45 0 0 1 240 115" fill="none" stroke="#E8873A" stroke-width="32" stroke-linecap="round"/>
  <path d="M 135 85 A 75 75 0 0 1 265 85" fill="none" stroke="#E8873A" stroke-width="32" stroke-linecap="round"/>

  <!-- Transmitter tip -->
  <circle cx="200" cy="160" r="32" fill="#E8873A"/>
</svg>
